name: CD (build & publish image)

# Deploys are manual/opt-in for a piloto, not on every push to main:
# - a git tag `v*` publishes a versioned + `latest` image.
# - `workflow_dispatch` lets an operator rebuild the current main on demand
#   (e.g. to pick up a base-image security patch) without cutting a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  test:
    # Never publish an image that hasn't passed the same test suite CI
    # enforces on every push — this job re-runs it as a hard gate.
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/deltix-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ensure-release:
    # Creates the GitHub Release for this tag exactly once, before the
    # build-tls-cert-tool matrix runs. Previously each matrix leg raced to
    # run `gh release view || gh release create` concurrently -- whichever
    # leg lost the race got an HTTP 422 ("tag_name already exists") and,
    # combined with the matrix's default fail-fast behavior, could cancel
    # the *other* leg before it uploaded its asset. A single dedicated job
    # removes the race entirely.
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure a GitHub Release exists for this tag
        run: gh release view "${GITHUB_REF_NAME}" || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tls-cert-tool:
    # Compiles scripts/generate-server-tls-cert.ts into standalone native
    # binaries (no repo checkout / `bun install` needed on the target
    # machine) and attaches them to the GitHub Release for this tag, so an
    # operator can generate a production TLS cert with a single downloaded
    # file. Only runs on an actual tag push (a release must exist to attach
    # assets to) — skipped for `workflow_dispatch` reruns of `main`.
    needs: [test, ensure-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false -- one target's build/upload failing must never
      # cancel the other leg before it gets to upload its own asset.
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset_name: deltix-gen-cert-linux-x64
          - target: bun-linux-arm64
            asset_name: deltix-gen-cert-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - run: bun build ./scripts/generate-server-tls-cert.ts --compile --target=${{ matrix.target }} --outfile dist/${{ matrix.asset_name }}

      - name: Attach binary to the GitHub Release
        run: gh release upload "${GITHUB_REF_NAME}" "dist/${{ matrix.asset_name }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

