name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dolt CLI
        run: |
          curl -Lo /tmp/dolt-install.sh https://github.com/dolthub/dolt/releases/latest/download/install.sh
          sudo bash /tmp/dolt-install.sh
          dolt version
          dolt config --global --add user.name deltix-ci
          dolt config --global --add user.email deltix-ci@example.com

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Integration tests
        run: bun run test:integration

      - name: Smoke tests
        run: bun run test:smoke
